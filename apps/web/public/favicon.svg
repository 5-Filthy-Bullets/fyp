<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3956"/>
      <stop offset="0.5" stop-color="#172036"/>
      <stop offset="1" stop-color="#0a101e"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ticketFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbe3ee"/>
    </linearGradient>
    <linearGradient id="ticketSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9aa8bd"/>
      <stop offset="1" stop-color="#6b7a91"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34e0cc"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <filter id="dropBig" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <filter id="dropSmall" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <filter id="dropTiny" x="-20%" y="-50%" width="140%" height="250%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <clipPath id="baseClip">
      <rect x="24" y="16" width="464" height="464" rx="104"/>
    </clipPath>
  </defs>

  <!-- Base tile -->
  <rect x="24" y="16" width="464" height="464" rx="104" fill="url(#base)" filter="url(#dropBig)"/>
  <rect x="24" y="16" width="464" height="464" rx="104" fill="none" stroke="url(#rim)" stroke-width="4"/>
  <g clip-path="url(#baseClip)">
    <ellipse cx="256" cy="-40" rx="380" ry="230" fill="url(#gloss)"/>
  </g>

  <!-- Ticket: extruded side, then face -->
  <g filter="url(#dropSmall)">
    <path transform="translate(0 16)" d="M156 128 H356 a18 18 0 0 1 18 18 V205 a28 28 0 0 0 0 56 V320 a18 18 0 0 1 -18 18 H156 a18 18 0 0 1 -18 -18 V261 a28 28 0 0 0 0 -56 V146 a18 18 0 0 1 18 -18 Z" fill="url(#ticketSide)"/>
  </g>
  <path d="M156 128 H356 a18 18 0 0 1 18 18 V205 a28 28 0 0 0 0 56 V320 a18 18 0 0 1 -18 18 H156 a18 18 0 0 1 -18 -18 V261 a28 28 0 0 0 0 -56 V146 a18 18 0 0 1 18 -18 Z" fill="url(#ticketFace)"/>
  <path d="M160 130 H352" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.9" fill="none"/>

  <!-- Checkmark -->
  <path transform="translate(0 12)" d="M198 236 L238 276 L318 196" fill="none" stroke="#08574f" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M198 236 L238 276 L318 196" fill="none" stroke="url(#teal)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" filter="url(#dropTiny)"/>
  <path transform="translate(0 -5)" d="M204 234 L238 268 L312 194" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>

  <!-- Bottom bar -->
  <rect x="196" y="378" width="120" height="22" rx="11" fill="#08574f"/>
  <rect x="196" y="370" width="120" height="22" rx="11" fill="url(#teal)" filter="url(#dropTiny)"/>
  <rect x="208" y="374" width="96" height="4" rx="2" fill="#ffffff" opacity="0.35"/>
</svg>
